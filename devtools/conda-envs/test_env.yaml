name: test
channels:
  - psi4
  - conda-forge
  - defaults

dependencies:

  # core
  - python
  - pip

  # qm
  - dftd3
  - psi4 >= 1.3.0
  - intel-openmp == 2021.4.0
  - geometric

  # qcstack
  - postgresql >= 13.0
  - qcelemental>=0.26
  - qcengine
  # TODO: evaluate current qcfractal compatibility after Python 3.13 migration.
  - qcfractal
  - requests

  # deps
  - rdkit
  - numpy
  - scipy >= 1.9
  - tqdm

  # weird mamba mismatch
  - h5py>=3.8

  - pytest >= 4.6.4
  - pytest-cov
  - pytest-xdist

  # Pip-only installs
  - pip:
      - duecredit
      - msgpack>=1.0
